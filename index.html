<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>八友御风</title>
<meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="八友御风">
<style>
/* unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 — 大鹅基金看板家族样式 */
:root{--bg:#121213;--card:#18181a;--raised:#212124;--line:rgba(237,237,237,.08);--fg:#ededed;--sec:#a1a1a6;--mute:#85858b;--up:#e5484d;--dn:#3fb37f;
--serif:"Noto Serif CJK SC","Songti SC","STSong",serif;--sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:1440px;margin:0 auto;padding:32px 32px calc(32px + env(safe-area-inset-bottom))}
header.mast{display:flex;align-items:flex-start;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.seal{flex:none;width:44px;height:44px;border-radius:6px;background:var(--acc);color:#121213;font:500 26px/44px var(--serif);text-align:center}
.brand{font-size:13px;color:var(--sec);line-height:20px}
h1{font:500 28px/1.2 var(--serif);margin:0 0 4px;letter-spacing:.02em}
h2{font-size:15px;font-weight:500;margin:0 0 12px;line-height:22px}
h3{font-size:15px;font-weight:500;margin:0 0 8px;line-height:22px}
.mute{color:var(--mute);font-size:12px;line-height:18px}
#meta{font-family:var(--mono),var(--sans);font-size:12px;color:var(--mute);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin:0 0 16px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;height:36px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{position:sticky;top:0;background:var(--raised);cursor:pointer;user-select:none;font-weight:400;font-size:12px;color:var(--mute);transition:color .15s var(--ease)}
th:hover,th.s{color:var(--fg)}
td{font-family:var(--mono),var(--sans);font-size:13px}
td:nth-child(2),th:nth-child(2){text-align:left;position:sticky;left:0;z-index:1;font-family:var(--sans)}
td:nth-child(2){background:var(--card)}th:nth-child(2){background:var(--raised)}
.p{color:var(--up)}.n{color:var(--dn)}.in{color:var(--up)}.out{color:var(--dn)}
.yes{color:var(--sec)}.no{color:var(--mute);opacity:.6}
.tag{font:12px/18px var(--sans);padding:0 6px;border-radius:4px;margin-left:8px;color:var(--sec);border:1px solid var(--line);background:var(--raised)}
select{transition:background-color .15s var(--ease),border-color .15s var(--ease)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
footer{margin:32px 0 0;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;text-align:left}
@media(max-width:640px){.page{padding:16px 16px calc(24px + env(safe-area-inset-bottom))}h1{font-size:24px}.seal{width:40px;height:40px;font-size:22px;line-height:40px}header.mast{gap:12px;padding-bottom:16px;margin-bottom:16px}.card{padding:16px}th,td{padding:8px 10px}}

:root{--acc:#7fa7d9;--acc-ink:#9dbbe3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips span{font-size:13px;line-height:20px;padding:6px 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line)}
.chips span::after{content:attr(data-c);font-family:var(--mono);color:var(--mute);font-size:12px;margin-left:8px}
table{min-width:760px}
tr.top td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
tr.top td:nth-child(2){color:var(--acc-ink)}
tbody tr:hover td{background:var(--raised)}
#rule{font-size:13px;line-height:22px;color:var(--sec)}#rule b{font-weight:500;color:var(--fg)}
.tag.in{color:var(--up);border-color:rgba(229,72,77,.35);background:transparent}
</style></head><body>
<div class="page">
<header class="mast"><div class="seal" aria-hidden="true">风</div><div><div class="brand">大鹅基金 · 风部 ETF 轮动看板</div><h1>八友御风</h1>
<div id="meta">加载中…</div></div></header>
<div class="card"><h2>当期八友</h2><div class="chips" id="top"></div>
<div class="mute" id="chg"></div></div>
<div class="wrap"><table id="t"><thead><tr></tr></thead><tbody></tbody></table></div>
<div class="card mute" id="rule"></div>
<footer>仅为个人研究工具，不构成投资建议</footer>
</div>
<script>
const COLS=[["rank","排名"],["name","名称"],["code","代码"],["score","得分"],["r5","5日%"],["r20","20日%"],["r60","60日%"],["ex20","20日超额%"],["ex60","60日超额%"],["above20","站上MA20"],["above60","站上MA60"],["mom_rank","20日动量排名"],["close","收盘"]];
const PCT=new Set(["r5","r20","r60","ex20","ex60"]);let D,key="rank",asc=true;
const f=(k,v)=>typeof v==="boolean"?(v?'<span class="yes">是</span>':'<span class="no">否</span>'):PCT.has(k)?`<span class="${v>=0?'p':'n'}">${v>0?'+':''}${v.toFixed(2)}</span>`:v;
function render(){const rows=[...D.rows].sort((a,b)=>{let x=a[key],y=b[key];if(typeof x==="string")return asc?x.localeCompare(y):y.localeCompare(x);return asc?x-y:y-x});
document.querySelector("thead tr").innerHTML=COLS.map(([k,l])=>`<th data-k="${k}" class="${k===key?'s':''}">${l}${k===key?(asc?' ▲':' ▼'):''}</th>`).join("");
document.querySelector("tbody").innerHTML=rows.map(r=>`<tr class="${r.top?'top':''}">`+COLS.map(([k])=>`<td>${f(k,r[k])}${k==="name"&&D.entered.includes(r.code)?'<span class="tag in">新进</span>':''}</td>`).join("")+"</tr>").join("");
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===key)asc=!asc;else{key=k;asc=["rank","mom_rank","name","code"].includes(k)}render()})}
fetch("data/latest.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{D=d;const nm=c=>(d.rows.find(r=>r.code===c)||{name:c}).name;
document.getElementById("meta").textContent=`数据日期 ${d.data_date} · 更新于 ${d.updated_at}（北京时间） · 基准${d.benchmark.name} 20日 ${d.benchmark.r20}% / 60日 ${d.benchmark.r60}% · 数据源 ${d.sources.join("/")}`+(d.failed.length?` · 抓取失败: ${d.failed.join(",")}`:"");
document.getElementById("top").innerHTML=d.top_codes.map(c=>`<span data-c="${c}">${nm(c)}</span>`).join("");
document.getElementById("chg").innerHTML=d.prev_top_codes.length?`对比上期(${d.prev_date})：<span class="in">进入 ${d.entered.map(nm).join("、")||"无"}</span> ｜ <span class="out">退出 ${d.exited.map(c=>nm(c)+" "+c).join("、")||"无"}</span>`:"暂无上期数据（下次更新后显示进出名单）";
document.getElementById("rule").innerHTML="<b>得分规则</b>　"+d.rule+"。百分位为在本池内的相对排名（0=最弱，100=最强）；超额=ETF涨幅−沪深300涨幅；前"+d.top_n+"名为当期八友。";render()})
.catch(e=>document.getElementById("meta").textContent="数据加载失败："+e);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
